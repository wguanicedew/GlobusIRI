# Replace storage paths with files/directories your Globus identity can access.
# This example uses fixed HPC paths for transfer-demo-001; submit with:
# globusiri submit --job perlmutter_transfer_job.yaml --run-id transfer-demo-001
# For another concurrent copy, change the run ID AND every transfer path below.
# Transfer paths are literal paths, not template placeholders.
site: NERSC_Perlmutter
name: perlmutter-transfer
template_file: shell_job_template.sh
template_vars:
  command: |
    test -f input.txt
    wc -w < input.txt > wordcount.txt
resources:
  project: m2616
  queue: debug
  constraint: cpu
  n_node: 1
  n_core_per_node: 1
  n_process_per_node: 1
  duration: 5m
inputs: {}
staging:
  e2e:
    enabled: true
    # dst is the destination file, used as given. With rucio_deterministic: true (default
    # false), dst is a directory (e.g. an RSE's .../rucio) and the file goes to
    # <dst>/<scope dirs>/<md5[0:2]>/<md5[2:4]>/<name>, name defaulting to src's basename.
    # Set both here for every transfer, or per stagein/stageout section, or per file:
    #   rucio_deterministic: true
    #   scope: user.wguan
    #   stagein:
    #     files:
    #       - {src: /pnfs/.../x.root, dst: /global/cfs/cdirs/m2616/harvester_workdir/rucio}
    #       - {src: /pnfs/.../y.root, dst: /global/cfs/cdirs/m2616/harvester_workdir/rucio, scope: mc23, name: y2.root}
    #       - {src: /pnfs/.../in.txt, dst: /global/cfs/cdirs/m2616/harvester_workdir/run1/in.txt, rucio_deterministic: false}
    #       - "/pnfs/.../w.root /global/cfs/cdirs/m2616/harvester_workdir/rucio data18:w2.root"  # SCOPE[:NAME] column
    stagein:
      files:
        - src: /pnfs/usatlas.bnl.gov/atlasdatadisk/globusiri-examples/input.txt
          dst: /global/cfs/cdirs/m2616/harvester_workdir/transfer-demo-001/input.txt
    stageout:
      files:
        - src: /global/cfs/cdirs/m2616/harvester_workdir/transfer-demo-001/wordcount.txt
          dst: /pnfs/usatlas.bnl.gov/atlasdatadisk/globusiri-examples/transfer-demo-001/wordcount.txt
  https_stageout:
    stdout_stderr: true
    files: [wordcount.txt]
cleanup:
  remote_run_dir: false
  e2e_stagein: false
