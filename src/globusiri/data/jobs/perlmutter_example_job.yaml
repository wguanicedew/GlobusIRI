# GlobusIRI job file (example) for NERSC Perlmutter.
# `globusiri init` copies it to <WORK_DIR>/jobs/. Use it with:
#   globusiri job submit --job perlmutter_example_job.yaml
#   globusiri run        --job perlmutter_example_job.yaml
#   globusiri submit     --job perlmutter_example_job.yaml   (then `globusiri monitor` or `globusiri daemon`)
# Merge order (later wins): sites.<site>.job_defaults < this file < CLI --set key=value
# Relative local paths resolve against WORK_DIR; ${VAR} is expanded.

site: NERSC_Perlmutter          # key in sites.yaml; CLI SITE argument overrides
name: perlmutter-example        # IRI job name prefix; run_id is appended

template_file: perlmutter_iri_submit_template.sh   # <WORK_DIR>/templates/, else packaged
template_vars: {}               # extra placeholders for the template, e.g. {pandaQueueName: NERSC_Perlmutter_IRI}

resources:
  project: m2616
  queue: debug
  constraint: cpu
  n_node: 1
  n_core_per_node: 256
  n_process_per_node: 4
  gpu_cores_per_process: 0      # omitted from job_spec when 0
  memory: null                  # bytes; null = not requested
  duration: 30m
  launcher: null                # null | single | mpirun | srun | aprun | jsrun
  exclusive_node_use: true
  reservation_id: null
  custom_attributes: {}         # merged over site job_defaults.custom_attributes

# Local files that end up in <remote.work_dir>/<run_id>/ as <remote_name>.
inputs:
  pandaTokenFilename: inputs/panda_token
  pandaTokenKeyPath: inputs/panda_token_key
  x509UserProxy: ${X509_USER_PROXY}
# false (default): each input is uploaded as its own file.
# true: the inputs are uploaded as one globusiri_inputs.tar.gz, which the job script's
#   GLOBUSIRI_ARCHIVE block extracts (rank 0; the other ranks wait). Templates without that
#   block get it inserted after their header. Fewer uploads for many input files.
archive_inputs: false
panda_auth_origin: atlas.pilot

# Which tokens this job needs (used by `globusiri validate --job` and by `run`):
#   iri   - always
#   https - if the site's remote.upload_method is globus_https, or https_stageout is non-empty
#   e2e   - only if staging.e2e.enabled is true
staging:
  e2e:
    enabled: false              # true -> this job moves data with Globus E2E Transfer
    stagein:                    # used only when enabled; manifest, rucio and files add up
      manifest: null            # file of "SRC DST" lines
      rucio: []                 # e.g. [mc23_13p6TeV:EVNT.12345._000001.pool.root.1]
      files: []                 # inline, "SRC DST" or {src: ..., dst: ...}; HPC side is the mount path
      #  - /pnfs/usatlas.bnl.gov/atlasdatadisk/rucio/mc23/EVNT.root /global/cfs/cdirs/m2616/harvester_workdir/rucio/EVNT.root
    stageout:                   # only after the job finished successfully
      manifest: null
      rucio: []
      files: []
      #  - {src: /global/cfs/cdirs/m2616/harvester_workdir/out/AOD.root, dst: /pnfs/usatlas.bnl.gov/atlasdatadisk/rucio/out/AOD.root}
  https_stageout:               # downloaded after the job ends, into <WORK_DIR>/runs/<run_id>/
    stdout_stderr: true
    files: []                   # extra remote files, relative to <remote.work_dir>/<run_id>/

# Remove files on the HPC at the end of `globusiri run`. This happens only after the job
# finished successfully and the downloads/stage-out did not fail.
cleanup:
  remote_run_dir: false         # IRI rm of <remote.work_dir>/<run_id> (and <remote.log_dir>/<run_id>)
  e2e_stagein: false            # Globus delete of the stage-in files (needs staging.e2e.enabled)

# Local log for this run only (IRI submit, job state changes, HTTPS, E2E, errors). The global
# <WORK_DIR>/logs/globusiri.log still gets everything. Relative to WORK_DIR; {run_id} is replaced.
log: null                       # null = <WORK_DIR>/runs/<run_id>/globusiri.log
