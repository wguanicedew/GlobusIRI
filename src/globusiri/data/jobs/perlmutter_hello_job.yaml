# No PanDA credentials or E2E transfers. Edit project/queue for your allocation.
# globusiri submit --job perlmutter_hello_job.yaml
site: NERSC_Perlmutter
name: perlmutter-hello
template_file: shell_job_template.sh
template_vars:
  command: |
    echo "Hello from Perlmutter"
    hostname
    date -u
    echo "Job completed" > result.txt
resources:
  project: m2616
  queue: debug
  constraint: cpu
  n_node: 1
  n_core_per_node: 1
  n_process_per_node: 1
  duration: 5m
inputs: {}
staging:
  e2e:
    enabled: false
  https_stageout:
    stdout_stderr: true
    files: [result.txt]
cleanup:
  remote_run_dir: false
  e2e_stagein: false
