name: Test, build and publish

# Tests and a build on every push and pull request; published to PyPI when a tag is pushed
# (the tag is the version, e.g. v0.2.0 -> 0.2.0), and to TestPyPI on request (a manual run,
# publish, as <pyproject version>.dev<run number>).
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to TestPyPI (as <version>.dev<run number>; tags go to PyPI)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Python (requires-python >= 3.9); ubuntu-latest (26.04) has no 3.9 build
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A tag is the release version (v0.2.0 -> 0.2.0); any other run builds
      # <pyproject version>.dev<run number>, unique for TestPyPI.
      - name: Version
        id: version
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
              version=${GITHUB_REF_NAME#v}
          else
              base=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
              version=$base.dev$GITHUB_RUN_NUMBER
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "globusiri: $version"

      # The version lives in pyproject.toml and src/globusiri/__init__.py; stamp both.
      - name: Set the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/globusiri/__init__.py
          grep -n '^version = ' pyproject.toml
          grep -n '^__version__ = ' src/globusiri/__init__.py

      - name: Build and install-test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/install-test
          /tmp/install-test/bin/pip install dist/globusiri-*.whl
          [[ $(/tmp/install-test/bin/python -c 'import globusiri; print(globusiri.__version__)') == "$VERSION" ]]
          /tmp/install-test/bin/globusiri --version

      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  # With an API token (twine, user __token__): the repository (or organization) secret
  # PYPI_TOKEN for pypi.org, TEST_PYPI_TOKEN for test.pypi.org. The first upload of a new
  # project needs a token scoped to the whole account; later ones can use a project-scoped token.
  publish:
    needs: [test, build]
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Publish ${{ needs.build.outputs.version }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.PYPI_TOKEN || secrets.TEST_PYPI_TOKEN }}
          TWINE_REPOSITORY_URL: ${{ github.ref_type == 'tag' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
        run: |
          [[ -n $TWINE_PASSWORD ]] || { echo "::error::no PyPI token: set the secret PYPI_TOKEN (tags) or TEST_PYPI_TOKEN"; exit 1; }
          pip install twine
          # --skip-existing: a re-run of the same tag
          twine upload --skip-existing --non-interactive dist/globusiri-*.whl dist/globusiri-*.tar.gz
